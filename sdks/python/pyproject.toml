[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "finevoice"
version = "0.1.3"
description = "Python SDK for the FineVoice API"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["requests>=2.25"]

[tool.setuptools]
packages = ["finevoice"]
